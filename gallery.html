<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Gallery | THIRUPATHI AQUA</title>
    <meta
      name="description"
      content="Explore THIRUPATHI AQUA product, production and purity visuals."
    />
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/gallery.css" />
  </head>
  <body class="gallery-page intro-active">
    <div
      class="opening-intro"
      id="openingIntro"
      aria-label="THIRUPATHI AQUA cinematic introduction"
    >
      <div class="opening-glow"></div>
      <div class="opening-ring opening-ring-a"></div>
      <div class="opening-ring opening-ring-b"></div>
      <div class="opening-ring opening-ring-c"></div>
      <div class="opening-content">
        <img
          class="opening-logo"
          src="assets/logo/logo.png"
          alt="THIRUPATHI AQUA"
        />
        <span class="opening-line"></span>
        <p>PURE WATER. PURE LIFE.</p>
      </div>
    </div>
    <div data-header></div>
    <main>
      <section class="page-hero">
        <img
          src="assets/images/gallery/gallery-board.png"
          alt="THIRUPATHI AQUA visual gallery"
        />
        <div class="container page-hero-content">
          <span class="eyebrow">Gallery</span>
          <h1>Moments<br />of Purity.</h1>
          <p>A glimpse into our product, production and water story.</p>
        </div>
      </section>
      <section class="content-section">
        <div class="container">
          <div class="gallery-grid">
            <img
              src="assets/images/home/hero-brand.png"
              alt="THIRUPATHI AQUA cinematic brand scene"
              loading="lazy"
            /><img
              src="assets/images/purification/hero-purification.png"
              alt="Water bottling production line"
              loading="lazy"
            /><img
              src="assets/images/water/hero-water.png"
              alt="THIRUPATHI AQUA bottle in nature"
              loading="lazy"
            /><img
              src="assets/images/about/hero-about.png"
              alt="Purity and modern production"
              loading="lazy"
            /><img
              src="assets/images/sustainability/hero-sustainability.png"
              alt="Responsible water production"
              loading="lazy"
            /><img
              src="assets/images/gallery/gallery-board.png"
              alt="THIRUPATHI AQUA website visual collection"
              loading="lazy"
            />
          </div>
        </div>
      </section>
    </main>
    <div data-footer></div>
    <script src="js/common.js"></script>
    <script src="js/gallery.js"></script>
  </body>
</html>
